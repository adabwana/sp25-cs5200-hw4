version: '3.8'

services:
  python:
    build:
      context: ./.devcontainer/python
      dockerfile: python.Dockerfile
    volumes:
      - .:/workspaces/04-uniformed-search:cached
    command: sleep infinity

  clojure:
    build:
      context: ./.devcontainer/clojure
      dockerfile: clojure.Dockerfile
    volumes:
      - .:/workspaces/04-uniformed-search:cached
    command: sleep infinity

networks:
  default:
    name: cs4200_network